<title>天工开物 Kaiwu AI</title>

<style id="local-fonts">
/* 离线字体：原 demo 用 Google Fonts，国内打不开，这里换成本地 woff2 */
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300;font-display:swap;src:url('fonts/cormorant-normal-300.woff2') format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/cormorant-normal-400.woff2') format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/cormorant-normal-500.woff2') format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:300;font-display:swap;src:url('fonts/cormorant-italic-300.woff2') format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:400;font-display:swap;src:url('fonts/cormorant-italic-400.woff2') format('woff2')}
@font-face{font-family:'Noto Serif SC';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/notoserifsc-600.woff2') format('woff2')}

</style>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* 版心：Obsidian 式全屏电影首屏，内页是同一套线分隔的“行”。三种皮肤共用一组变量，强调色只给印章、7 天内截止、主按钮、最划算。 */
:root{
  --bg:#0E0F11; --fg:#ECEBE6; --line:#2B2D31; --mute:#8D9096; --tint:#1A1C20; --tint2:#17191C;
  --open:#7C8088; --accent:#E5412D; --inv-bg:#ECEBE6; --inv-fg:#0E0F11; --inv-mute:#6B6E74; --barinv:#CFCFCA;
  --footbg:#08090A; --footfg:#8D9096; --soft:#202226;
  --glass:rgba(18,19,22,.58); --glass-line:rgba(255,255,255,.16); --hero-fg:#F4F4F0;
  --f-display:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
  --f-cjk:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --d0:0s;
  color-scheme:dark;
}
html[data-skin="paper"]{--bg:#F5F5F3;--fg:#111214;--line:#DDDDD8;--mute:#6A6C70;--tint:#E9E9E5;--tint2:#EEEEEA;--open:#9A9CA0;--accent:#C8321E;--inv-bg:#111214;--inv-fg:#F5F5F3;--inv-mute:#A4A6AA;--barinv:#44464A;--footbg:#111214;--footfg:#A0A2A6;--soft:#E6E6E2;color-scheme:light}
html[data-skin="slate"]{--bg:#EEF1F5;--fg:#0F1B2A;--line:#D3DAE3;--mute:#5E6C7E;--tint:#E0E6EE;--tint2:#E6EBF2;--open:#8C9AAE;--accent:#C8321E;--inv-bg:#0F1B2A;--inv-fg:#EEF1F5;--inv-mute:#9AA8BA;--barinv:#3B4A5E;--footbg:#0F1B2A;--footfg:#9AA8BA;--soft:#DDE3EB;color-scheme:light}
html[data-accent="indigo"]{--accent:#6EA6E0}
html[data-skin="paper"][data-accent="indigo"],html[data-skin="slate"][data-accent="indigo"]{--accent:#1F4E79}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono)} .mute{color:var(--mute)} .num{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,3.4vw,48px)}
.cjk{font-family:var(--f-cjk);font-weight:900}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--mute)}
.idx{font-family:var(--f-cjk);font-weight:900;font-size:15px;color:var(--accent)}

/* 动效基础 */
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes fade{from{opacity:0}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes fcIn{from{opacity:0;transform:translateY(170px) rotate(0deg)}}
@keyframes wmIn{from{opacity:0;transform:translateY(60px);filter:blur(14px)}}
@keyframes cfail{to{visibility:hidden}}
@keyframes grainMove{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(0,0)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--d0) + var(--i,0)*70ms)}
.fadein{animation:fade .35s ease backwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* 转场幕布 */
#curtain{position:fixed;inset:0;z-index:200;pointer-events:none;display:grid;grid-template-columns:repeat(5,1fr);animation:cfail .01s linear 4s forwards}
#curtain i{background:var(--footbg);border-right:1px solid rgba(255,255,255,.06);transform:translateY(0);transition:transform .7s cubic-bezier(.7,0,.2,1);transition-delay:calc(var(--n)*60ms)}
#curtain.pre i{transition:none}
#curtain.hide i{transform:translateY(-101%)}
#curtain.below i{transform:translateY(101%);transition:none}
#curtain .brand-c{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:300;font-size:clamp(56px,11vw,170px);color:#F4F4F0;letter-spacing:-.02em;transition:opacity .35s ease,transform .7s cubic-bezier(.7,0,.2,1)}
#curtain.hide .brand-c{opacity:0;transform:translateY(-40px)}
#curtain.below .brand-c{opacity:0;transform:translateY(40px);transition:none}
#curtain .brand-c span{display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards .15s}

/* 导航（内页） */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .in{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .bn{font-family:var(--f-cjk);font-weight:900;font-size:22px;white-space:nowrap}
.brand .en{font-size:11px;letter-spacing:.3em;color:var(--mute)}
.seal{width:34px;height:34px;background:var(--accent);color:#fff;display:grid;grid-template:1fr 1fr/1fr 1fr;font-family:var(--f-cjk);font-weight:900;font-size:14px;line-height:1;text-align:center;align-items:center;flex:none}
.links{display:flex;gap:36px;font-size:15px}
.links a{padding:6px 0;border-bottom:2px solid transparent;transition:border-color .2s}
.links a:hover{border-color:var(--mute)}
.links a.on{font-weight:700;border-color:var(--fg)}
.right{display:flex;align-items:center;gap:4px}
.icon{width:44px;height:44px;display:grid;place-items:center;transition:opacity .2s}
.icon:hover{opacity:.6}
.menu-btn{display:none}
@media (max-width:900px){.links{display:none}.menu-btn{display:grid}.brand .en{display:none}.hnav .rt .ic.menu-btn{display:grid}}

/* 首页 */
.hero{position:relative;min-height:min(100svh,940px);height:max(760px,100svh);max-height:980px;overflow:hidden;background:#08090A;color:var(--hero-fg);isolation:isolate}
.hero-bg{position:absolute;inset:0;background:#08090A;z-index:0}
.hero::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(520px circle at var(--mx,50%) var(--my,40%),rgba(255,255,255,.07),transparent 60%)}
.grain{position:absolute;inset:-10%;z-index:6;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:grainMove 1.2s steps(4) infinite}
.wm{position:absolute;left:0;right:0;top:clamp(70px,11vh,120px);margin:0;z-index:2;font-family:var(--f-display);font-weight:300;font-size:clamp(104px,16.5vw,280px);line-height:.84;letter-spacing:-.025em;color:var(--hero-fg);pointer-events:none;transform:translate3d(var(--tx,0),var(--ty,0),0);will-change:transform}
.wm span{display:block;animation:wmIn 1.3s cubic-bezier(.2,.7,.2,1) backwards}
.wm .l1{margin-left:clamp(16px,13vw,240px);animation-delay:calc(var(--d0) + .05s)}
.wm .l2{margin-left:clamp(120px,40vw,720px);font-style:italic;font-weight:300;animation-delay:calc(var(--d0) + .22s)}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;mix-blend-mode:screen;transform:translate3d(var(--vx,0),var(--vy,0),0) scale(var(--vs,1.12));will-change:transform;animation:fade 2s ease backwards;animation-delay:var(--d0)}
.hero-scrim{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(to top,rgba(8,9,10,.88) 0%,rgba(8,9,10,0) 46%),linear-gradient(to bottom,rgba(8,9,10,.55),rgba(8,9,10,0) 22%)}
.hnav{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;right:0;z-index:20}
.hnav .in{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hnav .brand .bn,.hnav .brand .en{color:var(--hero-fg)}
.hnav .brand .en{opacity:.7}
.gp{background:rgba(20,21,24,.42);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hnav .pill{display:flex;gap:6px;padding:6px}
.hnav .pill a{padding:9px 24px;font-size:14px;letter-spacing:.04em;transition:background .25s,color .25s}
.hnav .pill a:hover{background:rgba(244,244,240,.92);color:#0E0F11}
.hnav .rt{display:flex;align-items:center;gap:10px}
.hnav .rt a,.hnav .rt button{padding:11px 20px;font-size:14px}
.hnav .rt .ic{width:44px;height:44px;padding:0;display:grid;place-items:center}
.hnav .rt .ic.menu-btn{display:none}
.note{position:absolute;z-index:7;font-size:13px;line-height:1.5;letter-spacing:.02em;color:var(--hero-fg);opacity:.9;animation:fade 1.2s ease backwards;animation-delay:calc(var(--d0) + 1s)}
.note b{display:block;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:40px;line-height:1}
.nl{left:clamp(16px,9vw,150px);top:47%}
.nr{right:clamp(16px,9vw,150px);top:38%;text-align:right}
.tag{position:absolute;z-index:8;left:50%;top:calc(clamp(70px,11vh,120px) + clamp(104px,16.5vw,280px)*1.72 + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:10px 22px;white-space:nowrap;animation:fade 1s ease backwards;animation-delay:calc(var(--d0) + .9s)}
.tag .k{font-family:var(--f-mono);font-size:13px;letter-spacing:.4em;color:var(--accent);font-weight:700}
.tag .s{width:1px;height:16px;background:rgba(244,244,240,.5)}
.tag .t{font-family:var(--f-cjk);font-weight:600;font-size:18px;letter-spacing:.06em}
.fan{position:absolute;z-index:10;left:50%;bottom:28px;transform:translateX(-50%);width:min(1344px,calc(100% - 2*clamp(16px,3.4vw,48px)));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.fc{--r:0deg;--y:0px;display:flex;flex-direction:column;min-height:292px;padding:18px 22px 16px;color:var(--hero-fg);background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);transform:translateY(var(--y)) rotate(var(--r));transition:transform .55s cubic-bezier(.2,.7,.2,1),background .3s,color .3s,opacity .3s;animation:fcIn 1s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--d0) + .7s + var(--i)*100ms)}
.fc:nth-child(1){--r:-4deg;--y:20px}.fc:nth-child(2){--r:-1.4deg;--y:2px}.fc:nth-child(3){--r:1.4deg;--y:2px}.fc:nth-child(4){--r:4deg;--y:20px}
.fan:hover .fc{opacity:.5}
.fan .fc:hover{opacity:1;--r:0deg;--y:-16px;background:rgba(244,244,240,.94);color:#0E0F11}
.fc .top{display:flex;justify-content:space-between;align-items:baseline}
.fc .nm{font-family:var(--f-cjk);font-weight:900;font-size:50px;line-height:1.1;margin-top:2px}
.fc .sb{font-family:var(--f-mono);font-size:11px;margin-top:4px;opacity:.62}
.fc .rows{margin-top:12px;border-top:1px solid rgba(244,244,240,.55);flex:1}
.fc:hover .rows{border-color:#0E0F11}
.fc .r{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(244,244,240,.16);font-size:14px}
.fc:hover .r{border-color:rgba(14,15,17,.14)}
.fc .r .a{font-family:var(--f-mono);font-size:12px;opacity:.6}
.fc .r .b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .r .c{font-family:var(--f-mono);font-size:13px;font-weight:600}
.fc .ft{font-size:12px;padding-top:10px;opacity:.65}
.badge-hot{background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 7px}
.hero .m-copy,.hero .m-list{display:none}
@media (max-width:760px){
  .hero{height:auto;min-height:100svh;max-height:none;display:flex;flex-direction:column;padding-bottom:0}
  .hnav .pill,.hnav .rt a{display:none}
  .wm{position:relative;top:auto;margin-top:92px;font-size:27vw;line-height:.86}
  .wm .l1{margin-left:16px}.wm .l2{margin-left:34vw}
  .hv{display:none}
  .hero-bg{background:#08090A url(assets/hero-poster.jpg) 50% 38%/cover no-repeat;opacity:.9}
  .note,.tag,.fan{display:none}
  .hero .m-copy{display:block;position:relative;z-index:8;padding:18px 20px 0}
  .m-copy .zh{font-family:var(--f-cjk);font-weight:900;font-size:30px}
  .m-copy .s{margin-top:6px;font-size:16px;opacity:.82}
  .hero .m-list{display:grid;position:relative;z-index:8;margin-top:auto;grid-template-columns:1fr 1fr;border-top:1px solid rgba(244,244,240,.22)}
  .m-list a{display:flex;justify-content:space-between;align-items:center;padding:0 20px;min-height:78px;border-bottom:1px solid rgba(244,244,240,.22);background:rgba(8,9,10,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .m-list a:nth-child(odd){border-right:1px solid rgba(244,244,240,.22)}
  .m-list a span{display:flex;align-items:baseline;gap:10px}
  .m-list .n{font-family:var(--f-cjk);font-weight:900;font-size:26px}
}

/* 通用：页头、标签、按钮 */
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end;padding-block:36px 26px}
.ph h1{margin:6px 0 0;font-family:var(--f-cjk);font-weight:900;font-size:clamp(64px,9vw,120px);line-height:1.05;letter-spacing:-.02em}
.ph .lead{font-size:17px;line-height:1.7;max-width:460px}
.ph figure{margin:0}
.ph figure img{width:300px;height:140px;object-fit:cover;border:1px solid var(--line)}
@media (max-width:900px){.ph{grid-template-columns:1fr}.ph figure{display:none}}
.tabs{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:2px solid var(--fg);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs .l{display:flex;gap:32px;flex:none}
.tab{border-bottom:3px solid transparent;padding:14px 4px;color:var(--mute);font-size:16px;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);font-weight:700;border-color:var(--fg)}
.tab .c{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--fg);padding:6px 0;width:280px;font-size:14px;color:var(--mute);flex:none}
@media (max-width:700px){.search{display:none}}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:14px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:28px;font-weight:800}
.chip{font-size:14px;color:var(--mute);border-bottom:2px solid transparent;padding:4px 0;transition:color .2s}
.chip:hover{color:var(--fg)}.chip.on{color:var(--fg);font-weight:700;border-color:var(--fg)}
.seg{display:flex}
.seg button{border:1px solid var(--fg);padding:9px 22px;font-size:14px;font-weight:700;transition:background .2s,color .2s}
.seg button+button{margin-left:-1px}
.seg button:hover{background:var(--tint2)}
.seg button.on{background:var(--fg);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;padding:11px 20px;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-o{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--fg);font-size:14px;padding:10px 22px;transition:background .2s,color .2s}
.btn-o:hover{background:var(--fg);color:var(--bg)}
.pill-d{font-size:12px;border:1px dashed var(--mute);color:var(--mute);padding:1px 7px;white-space:nowrap}
.pill-s{font-size:12px;border:1px solid var(--fg);padding:1px 7px;white-space:nowrap}
.tile{display:grid;place-items:center;background:var(--fg);color:var(--bg);font-weight:800;flex:none;border:1px solid var(--bg)}
.hot{background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:3px 8px;white-space:nowrap}
.rowl{display:block;color:var(--fg);border-bottom:1px solid var(--line);transition:background .25s,color .25s}
.rowl:hover{background:var(--fg);color:var(--bg)}
.rowl:hover .mute{color:var(--inv-mute)}
.rowl:hover .barbg{background:var(--barinv)}
.foot{background:var(--footbg);color:var(--footfg);margin-top:80px}
.foot .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;padding-block:56px 36px;align-items:start}
.foot .wmk{font-family:var(--f-display);font-weight:300;font-style:italic;font-size:clamp(56px,9vw,128px);line-height:.9;color:#F4F4F0}
.foot .cols{display:grid;grid-template-columns:repeat(3,auto);gap:48px;font-size:14px;line-height:2.2}
.foot .cols b{display:block;font-family:var(--f-mono);font-size:12px;font-weight:400;letter-spacing:.08em;color:#6B6E74}
.foot a:hover{color:#F4F4F0}
.foot .bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);padding-block:18px;font-family:var(--f-mono);font-size:12px}
@media (max-width:700px){.foot .top{grid-template-columns:1fr}.foot .cols{grid-template-columns:repeat(2,auto);gap:24px 40px}}

/* 模型榜单 */
.board-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:16px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:8px;display:block}
.chart{overflow-x:auto;border-top:2px solid var(--fg);padding-top:20px}
.chart-in{position:relative;min-width:900px;padding-left:40px}
.gl{position:absolute;left:40px;right:0;height:1px;background:var(--soft)}
.gv{position:absolute;left:0;width:30px;text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.cols{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.col{display:flex;flex-direction:column;align-items:center;padding:0 4px 10px;transition:background .25s}
.col:hover{background:var(--tint2)}
.bar-area{height:300px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar-area .v{font-family:var(--f-mono);font-size:16px;font-weight:700;margin-bottom:4px}
.bar{width:56%;transform-origin:bottom;animation:growY 1s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i)*50ms)}

          st.open = false; update(); camTo(i);
          if (i < GS.length - 1) { setTimeout(function () { select(i + 1, false); }, 800); } else { Snd.fanfare(); say('全部点亮！你已走完新手入门路线'); }
        }
        else if (a === 'reset') { st.done = {}; S.rm.done = {}; rmSave(); st.open = false; st.pos = 0; setAv(0); st.sel = 0; update(); camTo(0); }
      },
      key: function (e) { if (e.key === 'Escape' && st.open) { st.open = false; update(); camTo(st.sel); } else if (e.key === 'ArrowRight') select(st.sel + 1, st.open); else if (e.key === 'ArrowLeft') select(st.sel - 1, st.open); else if (e.key === 'Enter' && !st.open && document.activeElement === document.body) { st.open = true; update(); camTo(st.sel); } },
      resize: function () { if (G) G.resize(); else camTo(st.sel, true); }
    };
    // 拖动：2D 平移；3D 环绕
    var drag = null;
    view.addEventListener('pointerdown', function (e) { if (e.target.closest('.g-s,.g-bub,.g-read,.g-hud,.g-mini,.g-x,.g-toast')) return; drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, lx: e.clientX, ly: e.clientY }; view.classList.add('drag'); view.setPointerCapture(e.pointerId); });
    view.addEventListener('pointermove', function (e) {
      if (!drag) return;
      if (G) { G.orbit(-(e.clientX - drag.lx), e.clientY - drag.ly); drag.lx = e.clientX; drag.ly = e.clientY; return; }
      var c = clampCam(drag.cx + e.clientX - drag.x, drag.cy + e.clientY - drag.y, cam.s); cam.x = c[0]; cam.y = c[1]; applyCam();
    });
    view.addEventListener('pointermove', function (e) { var r = view.getBoundingClientRect(); ptr.x = (e.clientX - r.left) / r.width - 0.5; ptr.y = (e.clientY - r.top) / r.height - 0.5; if (!drag && !busy) layerPar(); });
    var end = function () { drag = null; view.classList.remove('drag'); };
    view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end);
    view.addEventListener('dblclick', function (e) { if (G && !e.target.closest('.g-s,.g-bub,.g-read,.g-hud')) G.resetOrbit(); });
    $('#g-mini').addEventListener('click', function (e) { if (G) return; var r = e.currentTarget.getBoundingClientRect(); var wx = (e.clientX - r.left) / r.width * GW, wy = (e.clientY - r.top) / r.height * GH; var c = clampCam(view.clientWidth / 2 - wx * cam.s, view.clientHeight / 2 - wy * cam.s, cam.s); cam.x = c[0]; cam.y = c[1]; applyCam(); });
    update(); camTo(st.sel, true); Snd.start();
    ldg.classList.add('off');
  };
  document.addEventListener('click', function (e) { var t = e.target.closest && e.target.closest('[data-g]'); if (t && gm) gm.act(t.getAttribute('data-g'), t.getAttribute('data-v')); });
  document.addEventListener('keydown', function (e) { if (gm && ACTIVE === 'roadmap') gm.key(e); });
  window.addEventListener('resize', function () { if (gm && ACTIVE === 'roadmap') gm.resize(); });

  /* ---------- 路由与渲染 ---------- */
  var ACTIVE = '';
  var parse = function () {
    var h = (location.hash || '#home').slice(1); var p = h.split('~');
    return { name: p[0] || 'home', id: p[1] || '', sub: p[2] || '', from: p[3] || '' };
  };
  var picksAside = function (glass) {
    if (!window.KAIWU_1013) return '';
    return window.KAIWU_1013.board({ guides: GUIDES,
      contests: CONTESTS.slice().sort(function (a, b) { return a.left - b.left; }).slice(0, 4).map(function (c) { return { t: c.title, sub: (c.online ? '线上' : c.place) + ' · 奖金 ' + money2(c.prize), meta: '剩 ' + c.left + ' 天', hot: c.left <= 7, href: '#contest~' + c.id }; }),
      models: CHG.filter(function (x) { return x[0] === 'models'; }).slice(0, 4).map(function (x) { return { t: x[2], sub: x[1], meta: md(addDays(x[3])), href: '#models' }; }) }, { glass: glass });
  };
  var picksBand = function () { return window.KAIWU_1013 ? window.KAIWU_1013.picks(GUIDES) : ''; };
  var cocreateView = function () { var K = window.KAIWU_1013; return K.cocreate({ nav: navHTML('cocreate'), footer: footHTML(), guides: null, ph: phHTML('壹', K.CASES.length + ' 个案例 · 持续收集中', '共创', 'AI 学习案例和产品案例：别人是怎么学会、怎么做出来的。', '', '', picksAside()) }); };
  var caseView = function (id) { return window.KAIWU_1013.caseDetail(id, { nav: navHTML('cocreate'), footer: footHTML() }) || cocreateView(); };
  var viewFor = function (r) {
    switch (r.name) {
      case 'models': return modelsHTML();
      case 'model': return modelDetailHTML(r.id);
      case 'tools': return toolsHTML();
      case 'tool': return toolDetailHTML(r.id);
      case 'cocreate': return cocreateView();
      case 'case': return caseView(r.id);
      case 'deals': S.tools.lens = '当前福利'; history.replaceState(null, '', '#tools'); return toolsHTML();
      case 'contests': return contestsHTML();
      case 'contest': return contestDetailHTML(r.id);
      case 'plan': return planDetailHTML(r.id, r.sub, r.from);
      case 'sources': return sourcesHTML();
      case 'guides': return guidesHTML();
      case 'guide': return guideHTML(r.id);
      case 'roadmap': return roadmapHTML();
      case 'deal': var dl = window.KAIWU_1013.DEALS.filter(function (x) { return x.id === r.id; })[0]; if (!dl) { S.tools.lens = '当前福利'; } history.replaceState(null, '', dl ? window.KAIWU_1013.landHref(dl) : '#tools'); return viewFor(parse());
      default: return homeHTML();
    }
  };
  var heroFX = null, cdTimer = null;
  var after = function (r) {
    window.scrollTo(0, 0);
    if (r.sub === 'deals') setTimeout(function () { var kd = document.getElementById('kw-deals'); if (kd) window.scrollTo(0, kd.getBoundingClientRect().top + window.scrollY - 84); }, 80);
    if (heroFX) { heroFX(); heroFX = null; }
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    if (r.name === 'home' || !r.name) {
      var hero = $('#hero'); var v = $('.hv');
      if (v) { try { var p = v.play(); if (p && p.catch) p.catch(function () { /* 自动播放被拦截时保留封面 */ }); } catch (e) { /* 忽略 */ } }
      if (hero && !reduce && matchMedia('(pointer:fine)').matches) {
        var raf = 0, tx = 0, ty = 0, cx = 0, cy = 0, live = true;
        var wm = $('.wm', hero), hv = $('.hv', hero);
        var onMove = function (e) { var b = hero.getBoundingClientRect(); tx = (e.clientX - b.left) / b.width - 0.5; ty = (e.clientY - b.top) / b.height - 0.5; };
        var onLeave = function () { tx = 0; ty = 0; };
        var loop = function () {
          if (!live) return;
          cx += (tx - cx) * 0.065; cy += (ty - cy) * 0.065;
          hero.style.setProperty('--mx', ((cx + 0.5) * 100).toFixed(1) + '%'); hero.style.setProperty('--my', ((cy + 0.5) * 100).toFixed(1) + '%');
          if (hv) { hv.style.setProperty('--vx', (cx * 130).toFixed(1) + 'px'); hv.style.setProperty('--vy', (cy * 84).toFixed(1) + 'px'); }
          if (wm) { wm.style.setProperty('--tx', (cx * -34).toFixed(1) + 'px'); wm.style.setProperty('--ty', (cy * -20).toFixed(1) + 'px'); }
          raf = requestAnimationFrame(loop);
        };
        hero.addEventListener('mousemove', onMove); hero.addEventListener('mouseleave', onLeave);
        raf = requestAnimationFrame(loop);
        heroFX = function () { live = false; cancelAnimationFrame(raf); hero.removeEventListener('mousemove', onMove); hero.removeEventListener('mouseleave', onLeave); };
      }
    }
    gm = null; if (r.name === 'roadmap') rmInit(); else Snd.stop();
    if (r.name === 'models') countUps();
    if (r.name === 'deals') {
      var left = 31 * 3600; var el = $('#cd-t');
      var tick = function () { left = Math.max(0, left - 1); var h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60; var d = Math.floor(h / 24); var pad = function (n) { return String(n).padStart(2, '0'); }; if (el) el.textContent = d + ' 天 ' + pad(h % 24) + ':' + pad(m) + ':' + pad(s); };
      cdTimer = setInterval(tick, 1000);
    }
  };
  var render = function () {
    var r = parse(); ACTIVE = r.name; root.setAttribute('data-route', r.name || 'home');
    app.innerHTML = viewFor(r);
    r = parse(); ACTIVE = r.name; root.setAttribute('data-route', r.name || 'home');
    termify(app);
    after(r);
  };
  window.addEventListener('kaiwu:tool-detail-refresh', function () {
    if (['tool', 'model', 'plan', 'cocreate'].indexOf(parse().name) < 0) return;
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  });
  var curtain = $('#curtain');
  var busy = false;
  var transition = function () {
    if (busy) { render(); return; }
    if (reduce) { render(); return; }
    busy = true;
    curtain.className = 'below';
    void curtain.offsetWidth;
    curtain.className = '';
    setTimeout(function () {
      render();
      curtain.className = 'hide';
      setTimeout(function () { curtain.className = 'below'; busy = false; }, 900);
    }, 850);
  };
  window.addEventListener('hashchange', transition);

  /* 局部刷新 */
  var part = function (sel, html) { var el = $(sel); if (el) { el.innerHTML = html; termify(el); } };
  var countUps = function () {
    if (reduce) return;
    $$('[data-count]').forEach(function (el) {
      var end = Number(el.getAttribute('data-count')); var t0 = performance.now();
      var step = function (t) { var k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); else el.textContent = end; };
      requestAnimationFrame(step);
    });
  };

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act'); var v = t.getAttribute('data-v');
    switch (act) {
      case 'vendor': S.models.vendor = v; part('#m-vendor', vendorHTML()); break;
      case 'auth': S.models.auth = v === '1'; part('#m-body', modelsBody()); countUps(); break;
      case 'dd': { var w2 = t.closest('.ddw'); var was2 = w2.classList.contains('open'); $$('.ddw.open').forEach(function (s) { s.classList.remove('open'); }); if (!was2) w2.classList.add('open'); break; }
      case 'cb': S.cb[v] = !S.cb[v]; t.closest('.cb').outerHTML = chgBar(v); break;
      case 'sub': { var w = t.closest('.subw'); var was = w.classList.contains('on'); $$('.subw.on').forEach(function (s) { s.classList.remove('on'); }); if (!was) w.classList.add('on'); break; }
      case 'copy': t.textContent = '已复制'; break;
      case 'srcb': S.src.board = v; part('#src-main', srcMainHTML()); $$('.tabs .tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); }); break;
      case 'mdeal': S.models.dealOnly = !S.models.dealOnly; part('#m-table', tableHTML()); break;
      case 'mbud': S.md.budget = Number(v); part('#md-plans', plansHTML(parse().id)); break;
      case 'mtool': S.md.tools[v] = !S.md.tools[v]; part('#md-plans', plansHTML(parse().id)); break;
      case 'mclr': S.md.budget = 0; S.md.tools = {}; part('#md-plans', plansHTML(parse().id)); break;
      case 'table': S.models.table = !S.models.table; part('#m-table', tableHTML()); break;
      case 'mtype': S.models.type = v; part('#m-body', modelsBody()); $$('.tabs .tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); }); countUps(); break;
      case 'mdsort': S.md.asc = !S.md.asc; part('#md-plans', plansHTML(parse().id)); break;
      case 'lens': S.tools.lens = v; var L = toolsListHTML(); part('#t-pills', L.pills); part('#t-feed', L.feed); break;
      case 'oplan': S.toold.open = S.toold.open === v ? null : v; part('#td-others', otherPlansHTML()); break;
      case 'dtype': S.deals.types[v] = !S.deals.types[v]; part('#d-main', dealsMainHTML()); break;
      case 'dtime': S.deals.time = v; part('#d-main', dealsMainHTML()); break;
      case 'deal': location.hash = '#deal~' + v; break;
      case 'closeDrawer': $('#drawer').classList.remove('on'); break;
      case 'ctrack': S.contests.track = v; part('#c-main', contestsMainHTML()); break;
      case 'cplace': S.contests[v] = !S.contests[v]; part('#c-main', contestsMainHTML()); break;
      case 'cprize': S.contests.minPrize = Number(v); part('#c-main', contestsMainHTML()); break;
      case 'csort': S.contests.sort = v; part('#c-main', contestsMainHTML()); break;
      case 'cview': S.contests.view = v; part('#c-main', contestsMainHTML()); break;
      case 'search': openSearch(); break;
      case 'menu': $('#menu').classList.add('on'); break;
      case 'closeOv': $('#search').classList.remove('on'); $('#menu').classList.remove('on'); break;
      case 'skinToggle': $('#skin').classList.toggle('on'); break;
      case 'setSkin': skin = v; LS.set('kw-skin', v); applySkin(); skinUI(); break;
      case 'setAccent': accent = v; LS.set('kw-accent', v); applySkin(); skinUI(); break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('#search').classList.remove('on'); $('#menu').classList.remove('on'); $('#drawer').classList.remove('on'); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  });

  /* 搜索 */
  var INDEX = [];
  Object.keys(byName).forEach(function (n) { INDEX.push({ k: '模型', t: n, s: byName[n].vendor, h: '#model~' + slug(n) }); });
  TOOLS.forEach(function (t) { INDEX.push({ k: '工具', t: t.name, s: t.vendor, h: '#tool~' + t.id }); });
  if (window.KAIWU_1013) window.KAIWU_1013.CASES.forEach(function (c) { INDEX.push({ k: '共创', t: c.t, s: window.KAIWU_1013.CATS[c.cat], h: '#case~' + c.id }); });
  CONTESTS.forEach(function (c) { INDEX.push({ k: '比赛', t: c.title, s: c.org, h: '#contest~' + c.id }); });
  var resHTML = function (q) {
    q = q.trim().toLowerCase();
    var list = INDEX.filter(function (x) { return !q || (x.t + ' ' + x.s + ' ' + x.k).toLowerCase().indexOf(q) >= 0; }).slice(0, 9);
    return list.length ? list.map(function (x) { return '<a href="' + x.h + '" data-act="closeOv"><span class="mono mute" style="font-size:12px">' + x.k + '</span><span style="font-size:16px;font-weight:700">' + esc(x.t) + '</span><span class="mute" style="font-size:13px">' + esc(x.s) + '</span></a>'; }).join('') : '<div class="mute" style="padding:24px 0">没有找到，换个关键词试试。</div>';
  };
  var openSearch = function () { $('#search').classList.add('on'); var q = $('#q'); q.value = ''; $('#res').innerHTML = resHTML(''); setTimeout(function () { q.focus(); }, 50); };
  $('#q').addEventListener('input', function (e) { $('#res').innerHTML = resHTML(e.target.value); });

  /* 皮肤切换（仅 demo 用） */
  var skinUI = function () {
    var S3 = [['night', '夜墨', '#0E0F11'], ['paper', '石墨白', '#F5F5F3'], ['slate', '冷灰蓝', '#EEF1F5']];
    $('#skin').innerHTML = '<div class="pn"><b>主题</b><div class="g">' + S3.map(function (s) { return '<button data-act="setSkin" data-v="' + s[0] + '" class="' + (skin === s[0] ? 'on' : '') + '"><span class="sw" style="background:' + s[2] + ';border:1px solid #888"></span>' + s[1] + '</button>'; }).join('') + '</div><b>强调色</b><div class="g"><button data-act="setAccent" data-v="vermilion" class="' + (accent === 'vermilion' ? 'on' : '') + '"><span class="sw" style="background:#C8321E"></span>朱砂</button><button data-act="setAccent" data-v="indigo" class="' + (accent === 'indigo' ? 'on' : '') + '"><span class="sw" style="background:#1F4E79"></span>靛蓝</button></div></div><button class="tg" data-act="skinToggle" aria-label="切换主题"><span class="mono" style="font-size:12px;letter-spacing:.08em">◐<span class="tx"> 主题</span></span></button>';
  };
  skinUI();

  /* 启动：开场幕布 */
  var mm = window.matchMedia('(max-width:760px)');
  if (mm.addEventListener) mm.addEventListener('change', function () { if (ACTIVE === 'home') render(); });
  if (!location.hash) { try { history.replaceState(null, '', '#home'); } catch (e) { /* 忽略 */ } }
  if (reduce) { curtain.style.animation = 'none'; curtain.className = 'hide'; root.style.setProperty('--d0', '0s'); render(); curtain.style.display = 'none'; }
  else {
    root.style.setProperty('--d0', '1.55s');
    render();
    setTimeout(function () { curtain.className = 'hide'; curtain.style.animation = 'none'; setTimeout(function () { curtain.className = 'below'; root.style.setProperty('--d0', '0s'); }, 1000); }, 1150);
  }
})();
</script>
