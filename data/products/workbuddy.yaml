name: WorkBuddy
vendor: tencent
category: agent
form: 桌面应用 + 移动 App
tagline: 用自然语言安排多步骤任务，自动处理本地文件并交付文档、表格、PPT 等成果。
intro: WorkBuddy 是腾讯的办公智能体，桌面端可处理文件、分析数据、编写代码并调用技能，独立移动 App 可在同账号下远程续聊和管理电脑任务。它自带套餐分标准版、高级版、旗舰版三档，按每月积分计量，积分与 CodeBuddy 同账号共享；也可在本地配置第三方模型的地址与密钥。
