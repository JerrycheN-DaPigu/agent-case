name: Google Antigravity
vendor: google
category: coding
form: 桌面应用 + 独立 IDE + CLI + VS Code 插件 + JetBrains 插件
tagline: Google 的智能体开发平台，可让 AI 在项目中读写文件、运行命令、操作浏览器，并通过计划和差异审查完成开发任务。
intro: Antigravity 是 Google 的智能体开发工具，提供桌面、IDE 与命令行工作方式，能结合代码、终端和浏览器推进任务并核验产物。它可使用 Google 最新的旗舰模型 Gemini 4 Argon 等；个人使用受 Google 账号、年龄与地区资格限制，官方批准地区不含中国大陆。
